<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Космический Кликер: Реформация</title>
<link rel="stylesheet" href="style.css">
<style>
/* Специфичные стили только для игры */
.top-bar{
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:10px 4px;
  background:rgba(10,15,30,0.95);
  backdrop-filter:blur(15px);
  border-radius:12px;
  border:1px solid rgba(88, 179, 255, 0.25);
  box-shadow:0 6px 20px rgba(0,0,0,0.6),
             inset 0 0 15px rgba(0,150,255,0.05);
  margin-bottom:12px;
}

@media (max-width: 768px) {
  .top-bar{
    flex-direction:column;
    gap:8px;
    padding:12px;
  }
}

.astro-btn{
  background:linear-gradient(145deg, rgba(25,35,70,0.95), rgba(15,25,50,0.95));
  border:none;
  color:#8bb9ff;
  padding:10px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  font-family:'Orbitron', sans-serif;
  transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border:1px solid rgba(88, 179, 255, 0.35);
  box-shadow:0 3px 12px rgba(0,0,0,0.4),
             inset 0 0 8px rgba(88, 179, 255, 0.08);
  letter-spacing:0.5px;
  text-transform:uppercase;
  min-height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1;
  margin:0 4px;
  touch-action:manipulation;
}

.astro-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,100,255,0.4),
             inset 0 0 12px rgba(88, 179, 255, 0.15);
  color:#b3d4ff;
  border-color:rgba(88, 179, 255, 0.5);
}

.stats-container{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
  width:100%;
  margin-bottom:12px;
}

@media (max-width: 480px) {
  .stats-container{
    grid-template-columns:1fr;
    gap:6px;
  }
}

.stat-card{
  background:rgba(15,20,40,0.85);
  backdrop-filter:blur(12px);
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(88, 179, 255, 0.2);
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  text-align:center;
  transition:all 0.3s ease;
  min-height:80px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.stat-label{
  font-size:11px;
  color:#8bb9ff;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  font-weight:500;
}

.stat-value{
  font-size:18px;
  font-weight:800;
  color:#fff;
  font-family:'Orbitron', sans-serif;
  text-shadow:0 0 8px rgba(0,180,255,0.5);
  background:linear-gradient(135deg, #00b4ff, #9d4edd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.main-game-area{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  width:100%;
  padding:16px;
  background:rgba(10,15,30,0.7);
  backdrop-filter:blur(20px);
  border-radius:15px;
  border:1px solid rgba(88, 179, 255, 0.25);
  box-shadow:0 8px 30px rgba(0,0,0,0.7),
             inset 0 0 20px rgba(0,150,255,0.1);
  margin-bottom:12px;
}

.stellar-energy{
  font-size:clamp(16px, 3.5vw, 24px);
  font-weight:800;
  background:linear-gradient(135deg, #00b4ff, #9d4edd, #ff6b6b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:0 2px 12px rgba(0,180,255,0.4);
  font-family:'Orbitron', sans-serif;
  letter-spacing:1px;
  text-align:center;
  margin:0;
  padding:0 8px;
}

.nova-core-area{
  position:relative;
  margin:12px 0;
  width:100%;
  display:flex;
  justify-content:center;
}

.nova-core{
  width:min(65vw, 250px);
  height:min(65vw, 250px);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #00b4ff, #4a00e0);
  background-size:cover;
  background-position:center;
  cursor:pointer;
  transition:all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  border:3px solid rgba(88, 179, 255, 0.45);
  box-shadow:0 0 50px rgba(0,180,255,0.6),
             inset 0 0 30px rgba(255,255,255,0.2);
  animation:pulse-glow 4s infinite alternate;
  touch-action:manipulation;
  -webkit-touch-callout:none;
}

.game-info{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
  width:100%;
  margin-top:12px;
}

.info-item{
  background:rgba(20,25,50,0.75);
  padding:10px 12px;
  border-radius:10px;
  border:1px solid rgba(88, 179, 255, 0.2);
  text-align:center;
  min-height:60px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.info-label{
  font-size:11px;
  color:#a0c8ff;
  margin-bottom:3px;
}

.info-value{
  font-size:14px;
  font-weight:700;
  color:#00e0ff;
  font-family:'Orbitron', sans-serif;
  text-shadow:0 0 8px rgba(0,224,255,0.4);
}

.singularity-btn{
  background:linear-gradient(145deg, #9d4edd, #ff6b6b);
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:15px;
  font-size:clamp(13px, 2.8vw, 16px);
  font-weight:800;
  cursor:pointer;
  margin:16px auto;
  display:block;
  transition:all 0.4s;
  font-family:'Orbitron', sans-serif;
  letter-spacing:1px;
  text-transform:uppercase;
  box-shadow:0 8px 25px rgba(157,78,221,0.6);
  border:2px solid rgba(255,255,255,0.25);
  width:100%;
  max-width:350px;
  min-height:55px;
}

.singularity-btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 12px 35px rgba(157,78,221,0.8);
}

.singularity-btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.upgrade-btn{
  background:linear-gradient(145deg, rgba(30,40,80,0.95), rgba(20,30,60,0.95));
  border:2px solid rgba(88, 179, 255, 0.3);
  border-radius:12px;
  padding:12px;
  color:#b3d4ff;
  font-family:'Orbitron', sans-serif;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.3s;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  min-height:95px;
}

.upgrade-value{
  font-size:16px;
  font-weight:800;
  color:#00e0ff;
  text-shadow:0 0 8px rgba(0,224,255,0.5);
}

.upgrade-price{
  font-size:10px;
  color:#ffd166;
  background:rgba(0,0,0,0.4);
  padding:3px 8px;
  border-radius:12px;
  border:1px solid rgba(255,209,102,0.4);
}

.skin-card{
  background:linear-gradient(145deg, rgba(25,20,50,0.95), rgba(15,10,30,0.95));
  border-radius:12px;
  overflow:hidden;
  transition:all 0.3s;
  border:2px solid rgba(157,78,221,0.35);
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  position:relative;
  cursor:pointer;
  min-height:160px;
}

.skin-card:hover{
  transform:translateY(-3px);
  border-color:rgba(157,78,221,0.6);
}

.skin-image{
  width:100%;
  height:85px;
  object-fit:cover;
  border-bottom:2px solid rgba(157,78,221,0.35);
}

.skin-name{
  font-size:11px;
  font-weight:600;
  color:#e0c3ff;
  margin-bottom:6px;
  min-height:28px;
}

.skin-price{
  font-size:12px;
  font-weight:bold;
  color:#ffd166;
  background:rgba(0,0,0,0.5);
  padding:4px 10px;
  border-radius:12px;
  display:inline-block;
}

.skin-owned-badge{
  position:absolute;
  top:6px;
  right:6px;
  background:#4caf50;
  color:white;
  padding:3px 6px;
  border-radius:10px;
  font-size:10px;
  z-index:2;
}

.achievement-card{
  background:linear-gradient(145deg, rgba(30,25,60,0.95), rgba(20,15,40,0.95));
  border-radius:12px;
  padding:12px;
  border:2px solid rgba(255,193,7,0.35);
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  text-align:center;
  transition:all 0.3s;
  position:relative;
}

.achievement-card.unlocked{
  border-color:#ffc107;
  background:linear-gradient(145deg, rgba(40,35,80,0.95), rgba(30,25,60,0.95));
  animation:achievementUnlock 0.5s ease;
}

@keyframes achievementUnlock {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.achievement-icon{
  font-size:28px;
  margin-bottom:8px;
  color:#ffc107;
}

.achievement-name{
  font-size:13px;
  font-weight:600;
  color:#ffd166;
  margin-bottom:6px;
}

.achievement-desc{
  font-size:10px;
  color:#b3a8ff;
  margin-bottom:8px;
}

.achievement-reward{
  font-size:11px;
  color:#81c784;
  font-weight:bold;
  background:rgba(27,50,43,0.6);
  padding:4px 8px;
  border-radius:8px;
  display:inline-block;
}

.achievement-notification {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: linear-gradient(145deg, rgba(255,193,7,0.95), rgba(255,152,0,0.95));
  color: white;
  padding: 15px 25px;
  border-radius: 15px;
  font-weight: bold;
  font-size: 16px;
  z-index: 9999;
  box-shadow: 0 10px 30px rgba(255,193,7,0.6);
  border: 2px solid rgba(255,255,255,0.3);
  text-align: center;
  min-width: 300px;
  animation: slideDown 3s ease forwards;
}

@keyframes slideDown {
  0% { transform: translateX(-50%) translateY(-100px); opacity: 0; }
  15% { transform: translateX(-50%) translateY(20px); opacity: 1; }
  85% { transform: translateX(-50%) translateY(20px); opacity: 1; }
  100% { transform: translateX(-50%) translateY(-100px); opacity: 0; }
}

.sound-toggle {
  position: fixed;
  top: 15px;
  left: 15px;
  background: rgba(25,35,70,0.9);
  border: 2px solid rgba(88, 179, 255, 0.4);
  color: #8bb9ff;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
}

.sound-toggle:hover {
  transform: scale(1.1);
  border-color: rgba(88, 179, 255, 0.7);
  color: #b3d4ff;
}

.menu-content{
  max-width:550px;
  margin:0 auto;
  padding:16px;
  text-align:center;
}

.creator-signature{
  font-size:clamp(20px, 4.5vw, 32px);
  font-weight:900;
  background:linear-gradient(135deg, #00b4ff, #9d4edd, #ff6b6b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:25px;
  text-shadow:0 0 15px rgba(0,180,255,0.4);
  line-height:1.2;
}

.code-input-container{
  background:rgba(25,35,70,0.85);
  padding:16px;
  border-radius:16px;
  border:2px solid rgba(88, 179, 255, 0.35);
  margin:25px 0;
  box-shadow:0 8px 25px rgba(0,0,0,0.6);
}

.stellar-code-input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  background:rgba(10,20,40,0.9);
  border:2px solid #00b4ff;
  border-radius:10px;
  color:white;
  font-size:14px;
  font-family:'Orbitron', sans-serif;
  text-align:center;
  letter-spacing:1px;
  min-height:45px;
}

.stellar-activate-btn{
  width:100%;
  padding:14px;
  background:linear-gradient(145deg, #00b4ff, #4a00e0);
  color:white;
  border:none;
  border-radius:10px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  transition:all 0.4s;
  font-family:'Orbitron', sans-serif;
  letter-spacing:1px;
  text-transform:uppercase;
  min-height:50px;
}

.quantum-flare{
  position:absolute;
  font-weight:800;
  font-size:16px;
  animation:quantum-float 1s ease forwards;
  pointer-events:none;
  text-shadow:0 0 15px currentColor;
  font-family:'Orbitron', sans-serif;
  z-index:100;
}

@keyframes quantum-float{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-50px) scale(0.7);}
}

@media (max-width: 768px) {
  .grid {
    grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
    max-height:400px;
  }
  
  .sound-toggle {
    top: 10px;
    left: 10px;
    width: 40px;
    height: 40px;
    font-size: 18px;
  }
}

@media (max-width: 480px) {
  .grid {
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" onclick="toggleMusic()">♪</button>

<div class="game-container">
  <div class="top-bar">
    <button class="astro-btn" onclick="toggleStellarMenu()">☰ СТАНЦИЯ</button>
    <button class="astro-btn" onclick="toggleQuantumUpgrades()">▲ МОДЕРНИЗАЦИЯ</button>
    <button class="astro-btn" onclick="toggleAchievements()">🏆 АЧИВКИ</button>
  </div>

  <div class="stats-container">
    <div class="stat-card">
      <div class="stat-label">ЭНЕРГИЯ</div>
      <div class="stat-value" id="stellarEnergy">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ПОКОЛЕНИЕ</div>
      <div class="stat-value" id="quantumGeneration">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">МНОЖИТЕЛЬ</div>
      <div class="stat-value" id="singularityMulti">×1</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">БОНУС АЧИВОК</div>
      <div class="stat-value" id="achievementsBonusDisplay">×1.00</div>
    </div>
  </div>

  <div class="main-game-area">
    <div class="stellar-energy">ЭНЕРГИЯ: <span id="energyDisplay">0</span></div>
    
    <div class="nova-core-area">
      <div class="nova-core" id="novaCore"></div>
    </div>
    
    <div class="game-info">
      <div class="info-item">
        <div class="info-label">ЯДРО</div>
        <div class="info-value" id="corePower">1</div>
      </div>
      <div class="info-item">
        <div class="info-label">АВТО-СБОР</div>
        <div class="info-value" id="autoHarvest">0/сек</div>
      </div>
      <div class="info-item">
        <div class="info-label">МНОЖИТЕЛЬ</div>
        <div class="info-value" id="quantumMulti">×1</div>
      </div>
      <div class="info-item">
        <div class="info-label">ИТОГ</div>
        <div class="info-value" id="totalOutput">×1</div>
      </div>
    </div>
    
    <button class="singularity-btn" id="singularityBtn" onclick="quantumSingularity()">
      СИНГУЛЯРНОСТЬ
    </button>
  </div>
</div>

<!-- Меню -->
<div class="panel" id="stellarMenu">
  <button class="close-panel" onclick="toggleStellarMenu()">×</button>
  <div class="menu-content">
    <div class="creator-signature">REFORMOTI СИСТЕМЫ</div>
    <div class="code-input-container">
      <input type="text" class="stellar-code-input" id="stellarCode" placeholder="ВВЕДИТЕ СЕКРЕТНЫЙ КОД">
      <button class="stellar-activate-btn" onclick="activateStellarCode()">АКТИВИРОВАТЬ</button>
      <div id="stellarMessage"></div>
    </div>
    <a href="https://discord.gg/8d2RQHvGhH" target="_blank" class="btn btn-discord" style="margin-top:20px;">🛸 DISCORD</a>
  </div>
</div>

<!-- Модернизации -->
<div class="panel" id="quantumUpgrades">
  <button class="close-panel" onclick="toggleQuantumUpgrades()">×</button>
  <div class="tabs">
    <button class="tab active" onclick="openTab('clickTab',this)">⚡ ЯДРО (30)</button>
    <button class="tab" onclick="openTab('autoTab',this)">🌀 АВТО (30)</button>
    <button class="tab" onclick="openTab('multiTab',this)">♾️ МНОЖ (15)</button>
    <button class="tab" onclick="openTab('shopTab',this)">🛒 МАГАЗИН</button>
  </div>

  <div id="clickTab" class="tab-content active">
    <div class="grid" id="clickUpgradesGrid"></div>
  </div>
  
  <div id="autoTab" class="tab-content">
    <div class="grid" id="autoUpgradesGrid"></div>
  </div>
  
  <div id="multiTab" class="tab-content">
    <div class="grid" id="multiplierGrid"></div>
  </div>
  
  <div id="shopTab" class="tab-content">
    <div class="tabs">
      <button class="tab active" onclick="openShopTab('skinsTab',this)">🌌 СКИНЫ (25)</button>
      <button class="tab" onclick="openShopTab('backgroundsTab',this)">✨ ФОНЫ (12)</button>
    </div>
    <div id="skinsTab" class="tab-content active">
      <div class="grid" id="skinsGrid"></div>
    </div>
    <div id="backgroundsTab" class="tab-content">
      <div class="grid" id="backgroundsGrid"></div>
    </div>
  </div>
</div>

<!-- Ачивки -->
<div class="panel" id="achievementsPanel">
  <button class="close-panel" onclick="toggleAchievements()">×</button>
  <div class="text-center mb-4">
    <div class="gradient-text-gold" style="font-size:24px; font-weight:800; margin-bottom:8px;">🏆 ДОСТИЖЕНИЯ</div>
    <div style="color:#a0c8ff; font-size:13px;">Открывайте достижения и получайте бонусы!</div>
    <div style="margin-top:16px; display:flex; justify-content:center; gap:16px; flex-wrap:wrap;">
      <div class="card" style="padding:8px 16px;">
        <div style="font-size:11px; color:#ffd166;">ОТКРЫТО</div>
        <div style="font-size:20px; font-weight:bold; color:#ffc107;" id="achievementsUnlocked">0/25</div>
      </div>
      <div class="card" style="padding:8px 16px;">
        <div style="font-size:11px; color:#8bb9ff;">БОНУС</div>
        <div style="font-size:20px; font-weight:bold; color:#00b4ff;" id="achievementsBonus">×1.00</div>
      </div>
    </div>
  </div>
  <div class="grid" id="achievementsGrid"></div>
</div>

<script>
// Весь JavaScript код игры остается без изменений
// (весь предыдущий JS код из game.html)
</script>
</body>
</html>
