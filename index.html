<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Let's GO</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0;
  font-family:'Orbitron', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background:#000 url('https://images.wallpaperscraft.ru/image/single/kosmos_zvezdy_tumannost_157030_3840x2400.jpg') center/cover no-repeat fixed;
  color:#fff;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:5px;
  transition:background-image 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-x:hidden;
  touch-action:pan-y;
  font-size:13px;
}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap');

.game-container{
  width:100%;
  max-width:1000px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  position:relative;
  z-index:1;
}

/* Верхняя панель */
.top-bar{
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:8px 3px;
  background:rgba(10,15,30,0.9);
  backdrop-filter:blur(12px);
  border-radius:12px;
  border:1px solid rgba(88, 179, 255, 0.2);
  box-shadow:0 5px 20px rgba(0,0,0,0.5);
  margin-bottom:10px;
}

.astro-btn{
  background:linear-gradient(145deg, rgba(25,35,70,0.9), rgba(15,25,50,0.9));
  border:none;
  color:#8bb9ff;
  padding:8px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:12px;
  font-family:'Orbitron', sans-serif;
  transition:all 0.3s;
  border:1px solid rgba(88, 179, 255, 0.3);
  box-shadow:0 3px 10px rgba(0,0,0,0.4);
  letter-spacing:0.5px;
  text-transform:uppercase;
  min-height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:1;
  margin:0 3px;
}

/* Статистика */
.stats-container{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
  width:100%;
  margin-bottom:10px;
}

.stat-card{
  background:rgba(15,20,40,0.85);
  backdrop-filter:blur(8px);
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(88, 179, 255, 0.15);
  box-shadow:0 4px 15px rgba(0,0,0,0.4);
  text-align:center;
  min-height:70px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.stat-label{
  font-size:10px;
  color:#8bb9ff;
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  font-weight:500;
}

.stat-value{
  font-size:16px;
  font-weight:800;
  color:#fff;
  font-family:'Orbitron', sans-serif;
  text-shadow:0 0 8px rgba(0,180,255,0.4);
  background:linear-gradient(135deg, #00b4ff, #9d4edd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

/* Основной игровой блок */
.main-game-area{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  width:100%;
  padding:15px;
  background:rgba(10,15,30,0.7);
  backdrop-filter:blur(15px);
  border-radius:15px;
  border:1px solid rgba(88, 179, 255, 0.2);
  box-shadow:0 8px 30px rgba(0,0,0,0.6);
  margin-bottom:10px;
}

.stellar-energy{
  font-size:clamp(16px, 3vw, 22px);
  font-weight:800;
  background:linear-gradient(135deg, #00b4ff, #9d4edd, #ff6b6b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:0 2px 10px rgba(0,180,255,0.3);
  font-family:'Orbitron', sans-serif;
  letter-spacing:0.5px;
  text-align:center;
  margin:0;
  padding:0 8px;
  word-break:break-word;
}

.nova-core-area{
  position:relative;
  margin:10px 0;
  width:100%;
  display:flex;
  justify-content:center;
}

.nova-core{
  width:min(60vw, 220px);
  height:min(60vw, 220px);
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #00b4ff, #4a00e0);
  background-size:cover;
  background-position:center;
  cursor:pointer;
  transition:all 0.15s;
  border:3px solid rgba(88, 179, 255, 0.4);
  box-shadow:0 0 40px rgba(0,180,255,0.5);
  position:relative;
  animation:pulse-glow 3s infinite alternate;
}

.nova-core:active{
  transform:scale(0.95);
  animation:click-pulse 0.2s;
}

@keyframes click-pulse{
  0%{transform:scale(1);}
  50%{transform:scale(0.95);}
  100%{transform:scale(1);}
}

@keyframes pulse-glow{
  0%{box-shadow:0 0 30px rgba(0,180,255,0.5);}
  100%{box-shadow:0 0 50px rgba(157,78,221,0.6);}
}

/* Игровая информация */
.game-info{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:8px;
  width:100%;
  margin-top:10px;
}

.info-item{
  background:rgba(20,25,50,0.7);
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(88, 179, 255, 0.15);
  text-align:center;
  min-height:55px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.info-label{
  font-size:10px;
  color:#a0c8ff;
  margin-bottom:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info-value{
  font-size:14px;
  font-weight:700;
  color:#00e0ff;
  font-family:'Orbitron', sans-serif;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 0 8px rgba(0,224,255,0.3);
}

/* Кнопка сингулярности */
.singularity-btn{
  background:linear-gradient(145deg, #9d4edd, #ff6b6b);
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:15px;
  font-size:clamp(12px, 2.5vw, 16px);
  font-weight:800;
  cursor:pointer;
  margin:15px auto;
  display:block;
  transition:all 0.4s;
  font-family:'Orbitron', sans-serif;
  letter-spacing:0.5px;
  text-transform:uppercase;
  box-shadow:0 8px 25px rgba(157,78,221,0.5);
  border:2px solid rgba(255,255,255,0.2);
  width:100%;
  max-width:350px;
  min-height:50px;
  position:relative;
  overflow:hidden;
}

/* Панели */
.panel{
  position:fixed;
  top:-100%;
  left:0;
  width:100%;
  height:100vh;
  height:100dvh;
  background:rgba(5,10,25,0.98);
  backdrop-filter:blur(20px);
  transition:top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  padding:60px 10px 15px;
  overflow-y:auto;
  overflow-x:hidden;
  z-index:1000;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

.panel.active{
  top:0;
}

.close-panel{
  position:fixed;
  top:10px;
  right:10px;
  background:rgba(255,107,107,0.2);
  border:none;
  color:#ff6b6b;
  width:35px;
  height:35px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
  transition:all 0.3s;
  border:2px solid rgba(255,107,107,0.3);
  z-index:1001;
  display:flex;
  align-items:center;
  justify-content:center;
}

.panel-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:15px;
  padding-bottom:12px;
  border-bottom:2px solid rgba(88, 179, 255, 0.2);
  justify-content:center;
}

.tab{
  background:rgba(40,50,100,0.8);
  border:none;
  color:#a0c8ff;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:11px;
  font-weight:600;
  font-family:'Orbitron', sans-serif;
  transition:all 0.3s;
  border:1px solid rgba(88, 179, 255, 0.2);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  letter-spacing:0.5px;
  min-width:100px;
  text-align:center;
  flex:1;
  min-height:35px;
}

.tab.active{
  background:linear-gradient(145deg, #4a00e0, #8e2de2);
  color:#fff;
  box-shadow:0 4px 15px rgba(74,0,224,0.5);
  border-color:rgba(142,45,226,0.6);
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
}

/* Система прокачки */
.upgrades-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:8px;
  padding:10px;
}

.upgrade-btn{
  background:linear-gradient(145deg, rgba(30,40,80,0.9), rgba(20,30,60,0.9));
  border:2px solid rgba(88, 179, 255, 0.25);
  border-radius:12px;
  padding:12px;
  color:#b3d4ff;
  font-family:'Orbitron', sans-serif;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.3s;
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  min-height:90px;
}

.upgrade-value{
  font-size:14px;
  font-weight:800;
  color:#00e0ff;
  text-shadow:0 0 8px rgba(0,224,255,0.4);
}

.upgrade-price{
  font-size:10px;
  color:#ffd166;
  background:rgba(0,0,0,0.3);
  padding:3px 8px;
  border-radius:12px;
  border:1px solid rgba(255,209,102,0.3);
  text-align:center;
  width:100%;
}

.upgrade-name{
  font-size:9px;
  opacity:0.8;
  text-align:center;
  line-height:1.2;
}

/* Магазин */
.shop-tabs{
  display:flex;
  gap:6px;
  margin-bottom:15px;
  justify-content:center;
  flex-wrap:wrap;
}

.shop-tab{
  background:rgba(40,30,80,0.8);
  border:none;
  color:#d1a5ff;
  padding:8px 15px;
  border-radius:10px;
  cursor:pointer;
  font-size:11px;
  font-weight:600;
  transition:all 0.3s;
  border:2px solid rgba(157,78,221,0.3);
  min-width:110px;
  text-align:center;
}

.shop-tab.active{
  background:linear-gradient(145deg, #9d4edd, #8e2de2);
  color:#fff;
  border-color:rgba(157,78,221,0.7);
}

.shop-tab-content{
  display:none;
}

.shop-tab-content.active{
  display:block;
}

.shop-container{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:10px;
  padding:10px;
}

/* Карточки скинов - ИСПРАВЛЕНО */
.skin-card{
  background:linear-gradient(145deg, rgba(25,20,50,0.9), rgba(15,10,30,0.9));
  border-radius:12px;
  overflow:hidden;
  transition:all 0.3s;
  border:2px solid rgba(157,78,221,0.3);
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  position:relative;
  cursor:pointer;
  min-height:150px;
}

.skin-card.owned{
  border:2px solid #4caf50;
  box-shadow:0 0 20px rgba(76,175,80,0.4);
}

.skin-card.available{
  border-color:rgba(0,180,255,0.6);
}

.skin-image{
  width:100%;
  height:85px;
  object-fit:cover;
  border-bottom:2px solid rgba(157,78,221,0.3);
}

.skin-info{
  padding:8px;
  text-align:center;
}

.skin-name{
  font-size:10px;
  font-weight:600;
  color:#e0c3ff;
  margin-bottom:6px;
  min-height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1.2;
}

.skin-price{
  font-size:11px;
  font-weight:bold;
  color:#ffd166;
  background:rgba(0,0,0,0.4);
  padding:4px 10px;
  border-radius:12px;
  display:inline-block;
  border:1px solid rgba(255,209,102,0.3);
}

.skin-owned-badge{
  position:absolute;
  top:6px;
  right:6px;
  background:#4caf50;
  color:white;
  padding:3px 6px;
  border-radius:10px;
  font-size:9px;
  font-weight:bold;
  z-index:2;
}

/* Панель музыки - в меню */
.music-panel{
  background:linear-gradient(145deg, rgba(30,20,70,0.9), rgba(20,15,50,0.9));
  border-radius:20px;
  padding:25px;
  margin:20px auto;
  max-width:500px;
  border:2px solid rgba(88,179,255,0.4);
  box-shadow:0 10px 30px rgba(0,0,0,0.7);
  text-align:center;
}

.music-title{
  font-size:20px;
  font-weight:700;
  background:linear-gradient(135deg, #8bb9ff, #9d4edd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:20px;
  letter-spacing:1px;
}

.volume-slider{
  width:100%;
  margin:20px 0;
  -webkit-appearance:none;
  background:rgba(0,0,0,0.5);
  height:8px;
  border-radius:4px;
  outline:none;
}

.volume-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:22px;
  height:22px;
  background:#00e0ff;
  border-radius:50%;
  cursor:pointer;
  box-shadow:0 0 15px #00e0ff;
  border:2px solid white;
  transition:0.2s;
}

.volume-slider::-webkit-slider-thumb:hover{
  transform:scale(1.2);
}

.music-controls{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:20px;
  flex-wrap:wrap;
}

.music-btn{
  background:rgba(30,40,80,0.9);
  border:none;
  color:white;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  border:1px solid rgba(255,255,255,0.2);
  transition:0.3s;
  min-width:100px;
}

.music-btn:hover{
  background:#4a00e0;
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(74,0,224,0.4);
}

.music-btn.active{
  background:#4caf50;
  box-shadow:0 0 20px rgba(76,175,80,0.5);
}

.current-track{
  color:#a0c8ff;
  font-size:13px;
  margin:15px 0;
  padding:10px;
  background:rgba(0,0,0,0.3);
  border-radius:10px;
}

/* Система ачивок */
.achievements-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:10px;
  padding:10px;
}

.achievement-card{
  background:linear-gradient(145deg, rgba(30,25,60,0.9), rgba(20,15,40,0.9));
  border-radius:12px;
  padding:12px;
  border:2px solid rgba(255,193,7,0.3);
  box-shadow:0 4px 15px rgba(0,0,0,0.5);
  text-align:center;
  position:relative;
  min-height:140px;
}

.achievement-card.unlocked{
  border-color:#ffc107;
  box-shadow:0 0 15px rgba(255,193,7,0.3);
}

.achievement-icon{
  font-size:24px;
  margin-bottom:8px;
  color:#ffc107;
}

.achievement-name{
  font-size:12px;
  font-weight:600;
  color:#ffd166;
  margin-bottom:6px;
}

.achievement-desc{
  font-size:10px;
  color:#b3a8ff;
  margin-bottom:8px;
  line-height:1.3;
}

.achievement-reward{
  font-size:10px;
  color:#81c784;
  font-weight:bold;
  background:rgba(27,50,43,0.5);
  padding:4px 8px;
  border-radius:8px;
  display:inline-block;
}

.achievement-progress{
  width:100%;
  height:4px;
  background:rgba(255,255,255,0.1);
  border-radius:2px;
  margin-top:8px;
  overflow:hidden;
}

.achievement-progress-bar{
  height:100%;
  background:linear-gradient(90deg, #4caf50, #81c784);
  border-radius:2px;
  transition:width 0.5s;
}

/* Меню */
.menu-content{
  max-width:600px;
  margin:0 auto;
  padding:15px;
  text-align:center;
}

.creator-signature{
  font-size:clamp(24px, 5vw, 32px);
  font-weight:900;
  background:linear-gradient(135deg, #00b4ff, #9d4edd, #ff6b6b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:30px;
  text-shadow:0 0 20px rgba(0,180,255,0.3);
  line-height:1.2;
}

.code-input-container{
  background:rgba(25,35,70,0.8);
  padding:20px;
  border-radius:20px;
  border:2px solid rgba(88, 179, 255, 0.3);
  margin:20px 0;
  box-shadow:0 8px 25px rgba(0,0,0,0.6);
}

.stellar-code-input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  background:rgba(10,20,40,0.9);
  border:2px solid #00b4ff;
  border-radius:10px;
  color:white;
  font-size:14px;
  font-family:'Orbitron', sans-serif;
  text-align:center;
  letter-spacing:1px;
  transition:all 0.3s;
  min-height:45px;
}

.stellar-code-input:focus{
  outline:none;
  border-color:#9d4edd;
  box-shadow:0 0 20px rgba(157,78,221,0.5);
}

.stellar-activate-btn{
  width:100%;
  padding:14px;
  background:linear-gradient(145deg, #00b4ff, #4a00e0);
  color:white;
  border:none;
  border-radius:10px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  transition:all 0.4s;
  font-family:'Orbitron', sans-serif;
  letter-spacing:1px;
  text-transform:uppercase;
  min-height:50px;
}

.stellar-activate-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,180,255,0.5);
}

.discord-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:linear-gradient(145deg, #5865F2, #4752c4);
  color:white;
  padding:14px 25px;
  border-radius:15px;
  text-decoration:none;
  font-weight:800;
  font-size:14px;
  margin-top:20px;
  transition:all 0.4s;
  width:100%;
  max-width:300px;
}

.discord-link:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 10px 30px rgba(88,101,242,0.5);
}

.stellar-message{
  color:#00e0ff;
  font-size:14px;
  margin-top:15px;
  display:none;
  font-weight:600;
  text-shadow:0 0 15px rgba(0,224,255,0.5);
}

/* Эффекты */
.quantum-flare{
  position:absolute;
  font-weight:800;
  font-size:16px;
  animation:quantum-float 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  pointer-events:none;
  text-shadow:0 0 15px currentColor;
  font-family:'Orbitron', sans-serif;
  z-index:100;
}

@keyframes quantum-float{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-50px) scale(0.8);}
}

/* Адаптивность */
@media (max-width: 480px){
  .stats-container{grid-template-columns:1fr;}
  .game-info{grid-template-columns:1fr;}
  .upgrades-grid{grid-template-columns:1fr;}
  .shop-container{grid-template-columns:1fr;}
  .achievements-grid{grid-template-columns:1fr;}
  .music-controls{flex-direction:column;}
  .music-btn{width:100%;}
}
</style>
</head>
<body>

<div class="game-container">
  <!-- Верхняя панель -->
  <div class="top-bar">
    <button class="astro-btn" onclick="toggleStellarMenu()">☰ СТАНЦИЯ</button>
    <button class="astro-btn" onclick="toggleQuantumUpgrades()">▲ ПРОКАЧКА</button>
    <button class="astro-btn" onclick="toggleAchievements()">🏆 АЧИВКИ</button>
  </div>

  <!-- Статистика -->
  <div class="stats-container">
    <div class="stat-card">
      <div class="stat-label">ЭНЕРГИЯ</div>
      <div class="stat-value" id="stellarEnergy">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ПОКОЛЕНИЕ</div>
      <div class="stat-value" id="quantumGeneration">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">МНОЖИТЕЛЬ</div>
      <div class="stat-value" id="singularityMulti">×1</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">БОНУС СКИНОВ</div>
      <div class="stat-value" id="skinBonusDisplay">×1.00</div>
    </div>
  </div>

function initAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    audioGainNode = audioContext.createGain();
    audioGainNode.connect(audioContext.destination);
    audioGainNode.gain.value = 0.7;
    document.getElementById('volumeSlider').value = 70;
    document.getElementById('volumeSlider').oninput = function(e) {
      if (audioGainNode) audioGainNode.gain.value = e.target.value / 100;
    };
  }
}

function toggleMusic() {
  initAudio();
  if (!musicUnlocked) { alert('❌ Сначала купите доступ к музыке!'); return; }
  if (audioContext.state === 'suspended') { audioContext.resume(); audioEnabled = true; }
  else { audioContext.suspend(); audioEnabled = false; }
}

function stopMusic() { if (audioContext) { audioContext.suspend(); audioEnabled = false; } }

function selectMusicTrack(index) {

// === ФОРМАТИРОВАНИЕ ЧИСЕЛ ===
function formatNumber(num) {
  if (num >= 1000000000000000) return (num / 1000000000000000).toFixed(1) + 'Q';
  if (num >= 1000000000000) return (num / 1000000000000).toFixed(1) + 'T';
  if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'B';
  if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
  return num.toString();
}

function createQuantumFlare(x, y, val, color = null) {
  const flare = document.createElement('div');
  flare.className = 'quantum-flare';
  flare.style.left = x + 'px';
  flare.style.top = y + 'px';
  const displayVal = typeof val === 'number' ? (isMobile ? formatNumber(val) : val.toLocaleString()) : val;
  flare.style.color = color || '#00b4ff';
  flare.textContent = '⚡+' + displayVal;
  document.querySelector('.nova-core-area').appendChild(flare);
  setTimeout(() => flare.remove(), 1000);
}

// === ОБРАБОТКА КЛИКА ===
function handleClick(x, y) {
  const now = Date.now();
  if (now - lastClickTime < 1000) {
    consecutiveClicks++;
    clickCombo = 1 + (consecutiveClicks * 0.01);
  } else {
    consecutiveClicks = 1;
    clickCombo = 1;
  }
  lastClickTime = now;
  
  totalClicks++;
  
  let clickDamage = corePower;
  let isCrit = Math.random() * 100 < criticalChance;
  let critMult = isCrit ? criticalMultiplier : 1;
  let totalDamage = Math.floor(clickDamage * quantumMulti * singularityMulti * skinBonusMulti * achievementMultiplier * clickCombo * critMult);
  
  stellarEnergy += totalDamage;
  if (stellarEnergy > highestEnergy) highestEnergy = stellarEnergy;
  
  let flareColor = isCrit ? '#ff6b6b' : '#00b4ff';
  createQuantumFlare(x, y, totalDamage, flareColor);
  
  updateCosmicInterface();
  checkAchievements();
}

novaCore.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
novaCore.addEventListener('touchend', (e) => {
  const touch = e.changedTouches[0];
  const rect = novaCore.getBoundingClientRect();
  handleClick(touch.clientX - rect.left, touch.clientY - rect.top);
  e.preventDefault();
}, { passive: false });
novaCore.onclick = (e) => {
  const rect = novaCore.getBoundingClientRect();
  handleClick(e.clientX - rect.left, e.clientY - rect.top);
};

// === ПРОВЕРКА АЧИВОК ===
function checkAchievements() {
  let newAchievements = false;
  achievements.forEach(achievement => {
    if (!unlockedAchievements.has(achievement.id) && achievement.condition()) {
      unlockedAchievements.add(achievement.id);
      newAchievements = true;
      if (achievement.reward.energy) stellarEnergy += achievement.reward.energy;
      if (achievement.reward.multiplier) achievementMultiplier *= achievement.reward.multiplier;
    }
  });
  if (newAchievements) updateAchievementsDisplay();
}

// === ОБНОВЛЕНИЕ ДИСПЛЕЯ АЧИВОК ===
function updateAchievementsDisplay() {
  const unlockedCount = unlockedAchievements.size;
  document.getElementById('achievementsUnlocked').textContent = `${unlockedCount}/${achievements.length}`;
  document.getElementById('achievementsBonus').textContent = `×${achievementMultiplier.toFixed(2)}`;
  const grid = document.getElementById('achievementsGrid');
  grid.innerHTML = '';
  achievements.forEach(achievement => {
    const unlocked = unlockedAchievements.has(achievement.id);
    const progress = achievement.progress();
    const card = document.createElement('div');
    card.className = `achievement-card ${unlocked ? 'unlocked' : 'locked'}`;
    card.innerHTML = `
      <div class="achievement-icon">${achievement.icon}</div>
      <div class="achievement-name">${achievement.name}</div>
      <div class="achievement-desc">${achievement.desc}</div>
      ${unlocked ? 
        `<div class="achievement-reward">
          ${achievement.reward.energy ? formatNumber(achievement.reward.energy) + ' ЭН' : ''}
          ${achievement.reward.multiplier ? '×' + achievement.reward.multiplier : ''}
        </div>` : 
        `<div class="achievement-reward" style="background:rgba(255,107,107,0.2); color:#ff6b6b;">ЗАБЛОКИРОВАНО</div>`
      }
      <div class="achievement-progress">
        <div class="achievement-progress-bar" style="width:${progress * 100}%"></div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// === БОНУС СКИНОВ ===
function calculateSkinBonus() {
  const totalSkins = ownedSkins.size + ownedSpecialSkins.size;
  if (totalSkins === 0) return 1;
  if (totalSkins === 1) return 2;
  let bonus = Math.pow(1.5, totalSkins - 1);
  bonus *= luckMultiplier;
  return bonus;
}

function renderSkins() {

        if (stellarEnergy < skin.price) return;

        skinsPurchased++;

        skinBonusMulti = calculateSkinBonus();
        updateCosmicInterface();
        checkAchievements();
        renderSkins();

    }
    container.appendChild(card);
  });
}

// === СИНГУЛЯРНОСТЬ ===
function quantumSingularity() {
  const cost = getRebirthCost();
  if (stellarEnergy < cost) return;
  
  quantumGeneration++;
  singularityMulti *= (2 + rebirthBonus);
  
  stellarEnergy = 0;
  corePower = 1;
  autoHarvest = 0;
  quantumMulti = 1;
  
  if (secretCodes['1324']?.used) corePower += 98453679;
  if (secretCodes['XaR03']?.used) { corePower += 290000000; quantumMulti *= 940; autoHarvest += 190000; }
  if (secretCodes['free2026']?.used) { stellarEnergy += 15000000; quantumMulti *= 2; }
  if (secretCodes['GALAXY2026']?.used) { stellarEnergy += 100000000; quantumMulti *= 5; criticalChance += 10; }
  if (secretCodes['VOID']?.used) { corePower *= 2; autoHarvest *= 2; quantumMulti *= 2; }
  if (secretCodes['COSMIC']?.used) { skinBonusMulti *= 2; luckMultiplier *= 2; }
  
  skinBonusMulti = calculateSkinBonus();
  updateCosmicInterface();
  checkAchievements();
}

// === ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ===
function updateCosmicInterface() {
  skinBonusMulti = calculateSkinBonus();
  const totalMulti = quantumMulti * singularityMulti * skinBonusMulti * achievementMultiplier * clickCombo;
  
  document.getElementById('stellarEnergy').textContent = formatNumber(stellarEnergy);
  document.getElementById('energyDisplay').textContent = formatNumber(stellarEnergy);
  document.getElementById('corePower').textContent = formatNumber(corePower);
  document.getElementById('autoHarvest').textContent = formatNumber(autoHarvest) + '/сек';
  document.getElementById('quantumMulti').textContent = '×' + formatNumber(quantumMulti);
  document.getElementById('totalOutput').textContent = '×' + totalMulti.toFixed(1);
  document.getElementById('quantumGeneration').textContent = quantumGeneration;
  document.getElementById('singularityMulti').textContent = '×' + singularityMulti;
  document.getElementById('skinBonusDisplay').textContent = '×' + skinBonusMulti.toFixed(1);
  
  const cost = getRebirthCost();
  document.getElementById('singularityBtn').disabled = stellarEnergy < cost;
  document.getElementById('singularityBtn').textContent = stellarEnergy >= cost ?
    `СИНГУЛЯРНОСТЬ ${quantumGeneration+1} (${formatNumber(cost)} ЭН)` : `НУЖНО ${formatNumber(cost)} ЭН`;
  
  renderClickUpgrades();
  renderAutoUpgrades();
  renderMultipliers();
  renderCriticalUpgrades();
  renderEnergyUpgrades();
  renderBonusUpgrades();
  renderSkins();
  renderSpecialSkins();
  renderBackgrounds();
}

// === ИНИЦИАЛИЗАЦИЯ ===
updateCosmicInterface();
updateAchievementsDisplay();
