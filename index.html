<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reformoti - Игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #43C6AC 0%, #191654 100%);
            color: white;
        }

        .navbar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .discord-btn {
            background: #5865F2 !important;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 2rem;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 2rem;
        }

        .back-button {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2em;
            text-decoration: none;
            color: #191654;
            background: #ffd700;
            border-radius: 50px;
            transition: 0.3s;
            margin-top: 2rem;
        }

        .back-button:hover {
            background: #ffed4e;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Reformoti</div>
        <div class="nav-links">
            <a href="index.html">Reformoti</a>
            <a href="#" class="discord-btn" onclick="window.open('https://discord.com/invite/8d2RQHvGhH', '_blank')">Discord</a>
        </div>
    </nav>

    <div class="container">
        <div class="game-container">
            <h1>🎮 Страница игры</h1>
            <p>Здесь будет ваша игра</p>
            <a href="index.html" class="back-button">← На главную</a>
        </div>
    </div>
</body>
</html>
